version: "3.8"

services:
  # 1. FastAPI Backend (Orchestrator)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FL_SERVER_HOST=0.0.0.0
      - FL_SERVER_PORT=8080
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONPATH=/app
    deploy:
      resources:
        limits:
          memory: 4g
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/api:/app/api
      - ./backend/client:/app/client
      - ./backend/server:/app/server
      - ./backend/shared:/app/shared
      - ./backend/config:/app/config
    # V20 FIX: Health check for container orchestration
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 2. React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_API_KEY=${VITE_API_KEY:-CHANGE_ME_BEFORE_DEPLOYMENT}
    depends_on:
      api:
        condition: service_healthy
